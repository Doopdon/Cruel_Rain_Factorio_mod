[entity-description]
iw-barbed-wire=Cheap wire wall. 80 health, no armor. Deals 4 physical damage per second to touching characters and units, including players. Made from two iron sticks.
iw-electric-fence=Electric fence pole. 180 health. Made from four iron sticks and two copper cables, with no circuits. Draws 20 kW idle or 200 kW during shocks, with accumulator sparks and electrical sound. Deals 40 electric damage per second to touching characters and units, including players, at the pole and along copper-wire spans connecting fence poles while charged. Connects to neighboring poles within 1.5 tiles and supplies a 5x5 area. Unpowered fences still block movement.
iw-powered-gun-turret=Requires ammunition and electricity: 10 kJ per shot, plus 1 kW idle draw. Crafting also requires five green electronic circuits.
iw-powered-flamethrower-turret=Requires fluid ammunition and electricity (50 kW). Supply power to its center. It stops when power runs out and resumes when charged. Crafting also requires ten green electronic circuits.
iw-claymore=Single-use improvised mine. Arms after 0.5 seconds. When an enemy approaches: 50% chance of a 250-damage explosion in a 3-tile radius; otherwise a small fire lasting about 5 seconds. Dud fire burns units and characters, including players, but does not damage structures.
iw-bear-trap=Single-use contact trap. Arms after 0.5 seconds. An enemy must step directly onto its center. Deals 100 physical damage to one enemy before armor, enough to kill a vanilla medium biter. Does not explode.
iw-spinner=A small fuel-powered base with a two-tile spinning rotor and a 3x3 damage square. Burns chemical fuel while spinning, even without enemies nearby. Deals 13 physical damage per second to enemies and player characters within the square before resistances. Characters are pushed directly away from the spinner, or perpendicular to a straight bank, when space permits; feeding inserters remain safe. Stops when empty; refuel to restart.
iw-defense-fire=A walkable coal-fed center with a 3x3 square of defensive fire. Includes five coal worth of starting fuel. Feed coal into its inventory by hand or with inserters. Automatic feeding stops at five queued coal; full stacks can be added by hand. Produces pollution and disappears entirely when its last fuel burns out. Deals 26 fire damage per second in the 3x3 square before resistances. Damages units and characters, including players. Structures and equipment are safe. Mining extinguishes it without returning the starter item.

