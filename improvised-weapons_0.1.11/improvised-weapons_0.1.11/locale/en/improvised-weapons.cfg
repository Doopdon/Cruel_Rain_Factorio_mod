[item-description]
iw-barbed-wire=A cheap, fragile wall with sharp wire. Touching it causes small physical damage. Players can be hurt too.
iw-electric-fence=A single electrified fence pole. Its actual copper wires form the fence. No electronic circuits required. Connect it to a powered network for contact damage. Players can be shocked too.
iw-claymore=A land mine with a pipe on top. Made from coal, stone, and a pipe. Half explode, half become a brief fire.
iw-bear-trap=A land mine with a gear on top. Deals a powerful single physical hit on direct enemy contact. Consumed when triggered.
iw-spinner=Fuel-powered 3x3 melee defense. Accepts chemical fuel such as coal. Remains in place when empty.
iw-defense-fire=Place a 3x3 burning defense fire. Feed coal into its center using one inserter. Feeding inserters are immune to this fire. Disappears when fuel runs out.

