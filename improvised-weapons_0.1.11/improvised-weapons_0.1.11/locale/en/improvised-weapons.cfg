[mod-setting-name]
iw-coal-burn-seconds=Defense fire: seconds per coal
iw-fire-pollution-per-minute=Defense fire: pollution per minute

[mod-setting-description]
iw-coal-burn-seconds=How long one coal keeps a defense fire burning. The five coal used in crafting also provide this much starting fuel each. Changes apply to the next coal consumed and newly placed fires.
iw-fire-pollution-per-minute=Pollution generated by each burning defense fire per minute. Default: 30, matching a vanilla boiler at full output. Can be changed during a game.
