[mod-setting-name]
biter-caution-duration=Danger memory (seconds)
biter-caution-limit=Maximum danger cells
biter-caution-nest-radius=Nest aggression radius
[mod-setting-description]
biter-caution-duration=How long a death-site barrier remains. More deaths in the same 3x3 cell refresh the timer. Expiry is rounded to the next second.
biter-caution-limit=Maximum active bug-only barriers across all surfaces. Extra new locations are ignored at the cap; existing cells still refresh.
biter-caution-nest-radius=Enemy deaths this close to an enemy spawner do not create or refresh caution cells. Existing caution cells at that death location are removed so nest defenders stay aggressive.
[entity-name]
biter-caution-pathing-wall=Temporary biter danger cell
