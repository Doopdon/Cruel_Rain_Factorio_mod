[mod-setting-description]
deep-caves-drip-volume=Recorded water droplets in all cave levels. Default 0.7; 0 mutes dripping. Surface weather volume is controlled separately.
deep-caves-enemy-density=Base chance per generated cave chunk, multiplied by distance from (0,0) (up to 4x at 3072 tiles) and depth (up to 3x on Cave 5), capped at 100%. 0 disables initial nests. Starter exclusion and protection for ramps, ores and factories still apply. Previously processed chunks stay unchanged.
deep-caves-vent-absorption=Pollution removed per minute by each surface-connected Cave 1 vent. Default 7.5, down from 10. 0 disables absorption; maximum 100. No power required. Restart Factorio to apply changes; existing worlds do not need to be restarted.
deep-caves-research-cost=Science research cost relative to normal: 0.1 is one tenth, 0.5 is half, 1 is normal. Default 0.1; range 0.01 to 100. Applies to infinite research too; minimum one research unit. Restart Factorio to apply. Changing a technology's cost can reset its partial progress; completed technologies remain researched.
deep-caves-rocket-cost=Rocket parts needed per launch relative to normal: 0.1 is one tenth, 0.5 is half, 1 is normal. Default 0.1; range 0.01 to 100. Rounded up, minimum one part. Restart Factorio to apply; existing worlds are supported.
deep-caves-surface-silos-only=Require rocket silos to be built above ground. Enabled by default. Disable to allow underground silos. Restart Factorio to apply; existing worlds are supported.
deep-caves-large-density=Approximate nodes along 256 tiles. Higher values add more nodes and tunnels. Default 1 (256-tile spacing). Requires restarting Factorio; use a new world to compare layouts.
deep-caves-small-density=Approximate nodes along 256 tiles. Higher values add more nodes and tunnels. Default 4 (64-tile spacing). Requires restarting Factorio; use a new world to compare layouts.
deep-caves-web-density=Approximate nodes along 256 tiles. Higher values add more nodes and tunnels. Default 10 (about 26-tile spacing). Requires restarting Factorio; use a new world to compare layouts.
deep-caves-large-width=Nominal tunnel width in tiles. Default 12. Junctions and diagonal bends can be wider. Requires restarting Factorio and a new world for a consistent layout.
deep-caves-small-width=Nominal tunnel width in tiles. Default 3. Junctions and diagonal bends can be wider. Requires restarting Factorio and a new world for a consistent layout.
deep-caves-web-width=Nominal tunnel width in tiles. Default 1. One-tile paths are cardinally connected and are not widened by a repair script. Requires restarting Factorio and a new world for a consistent layout.
