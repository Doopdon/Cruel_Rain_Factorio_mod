[entity-description]
deep-caves-surface-silo=Rocket silos can only be built above ground. Underground placement returns the building item.
deep-caves-vent=A natural opening to Nauvis. Absorbs up to __1__ pollution per minute from the cave, like trees. Step onto its center tile to travel to the surface. Click for cargo and fluids. Pipes connect to the four side ports; one fluid is shared with the matching ramp. Connect an adjacent pole to transfer power.
deep-caves-ramp-inventory=12 slots shared only with the matching ramp on the other level. Slots support cargo-wagon-style item filters; unfiltered slots accept any item. Inserters can load or unload from any edge of the ramp. Place them outside its footprint.
deep-caves-ramp-down=Approach the entrance to descend. Its cargo and fluid inventories are shared with the matching ramp below. Connect pipes to any of its four side ports and copper wires to the ramp to transfer fluids and power between levels.
deep-caves-ramp-up=Approach the entrance to ascend. Its cargo and fluid inventories are shared with the matching ramp above. Connect pipes to any of its four side ports and copper wires to the ramp to transfer fluids and power between levels.
deep-caves-ramp-fluid=One fluid shared with the matching ramp through normal pipe flow. Each end holds 1,000 fluid. Connect pipes two tiles from its grid center to the north, east, south or west. The connection graphics are hidden. Use separate ramp pairs for different fluids.

