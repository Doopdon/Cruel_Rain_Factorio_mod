[mod-setting-description]
surface-thunderstorm-character-damage=Storm exposure damage to characters physically on Nauvis. Default: 0.5 HP per second. 0 disables it. Caves and other planets stay sheltered. Armor cannot cancel the small pulses; energy shields can absorb them.
surface-thunderstorm-building-damage=Storm wear on destructible player buildings and vehicles on Nauvis. Default: 0.1 HP per second. 0 disables it. Crashed ships, rails and their elevated supports, enemy nests, natural rocks, flying robots and indestructible ramps are excluded. Damage pauses when the storm is disabled.
surface-thunderstorm-enabled=Continuous weather on Nauvis. Cave surfaces and other planets stay sheltered.
surface-thunderstorm-darkness=0 is normal daylight. Higher values add a darker overcast overlay. Default: 0.45. The actual day/night cycle and solar production are unchanged.
surface-thunderstorm-rain-intensity=Opacity of the rain overlay. 0 hides the rain. Default: 1 (heavy rain).
surface-thunderstorm-lightning=Brief sky flashes during the thunderstorm. Disable to keep rain without flashes.
surface-thunderstorm-volume=Volume of the rain and thunder sounds. 0 mutes both.

[damage-type-name]
surface-thunderstorm-exposure=Storm exposure
